name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  offline-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: >-
          uv run python scripts/run_cpu_pipeline.py
          --config tests/fixtures/synthetic_config.yaml
          --project-root .test-run
          --offline
