project:
  name: synthetic-perturbation-benchmark
  random_seed: 42
dataset:
  name: synthetic
  geo_accession: SYNTHETIC
  bioproject: SYNTHETIC
  provenance_url: https://example.invalid/synthetic
  processed_data_url: null
  condition_column: condition
  control_token: ctrl
