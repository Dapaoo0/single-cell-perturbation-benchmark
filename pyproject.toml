[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "single-cell-perturbation-benchmark"
version = "0.1.0"
description = "Leakage-aware benchmarking of scGPT and strong baselines on Norman Perturb-seq."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Dapaoo0" }]
dependencies = [
  "anndata>=0.10,<0.13",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15,<23",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "seaborn>=0.13,<0.14",
]

[project.optional-dependencies]
dev = [
  "jupyter>=1.0,<2",
  "nbclient>=0.10,<0.11",
  "nbformat>=5.10,<6",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/perturb_benchmark"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"
